<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>

<title>Pref</title>
</head>

<body>
    <h1 th:text="${message}">sample</h1>
    <h3>都道府県の座標を表示しています。</h3>
    <h3>------------------------------------------------</h3>
    <table>
        <tr>
            <th>自治体コード</th>
            <th>都道府県名</th>
            <th>市区名</th>
            <th>緯度(北緯)[10進数]</th>
            <th>経度(東経)[10進数]</th>
        </tr>
        <tr th:each="pref:${prefList}">
            <td th:text="${pref.prefCode}"></td>
            <td th:text="${pref.prefName}"></td>
            <td th:text="${pref.cityName}"></td>
            <td th:text="${pref.latitude}"></td>
            <td th:text="${pref.longitude}"></td>
        </tr>
    </table>
</body>

</html>
